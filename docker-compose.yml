services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dotas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dotas_dev_only}
      POSTGRES_DB: dotas_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  fixture:
    image: nginx:1.27-alpine
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
    ports:
      - "8088:80"

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - fixture
    environment: &app_environment
      DATABASE_URL: postgresql://dotas:${POSTGRES_PASSWORD:-dotas_dev_only}@db:5432/dotas_core
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TOR_PROXY_URL: ${TOR_PROXY_URL:-}
      SOURCE_HOST_ALLOWLIST: ${SOURCE_HOST_ALLOWLIST:-fixture,localhost,127.0.0.1}

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker -Q crawl,normalize,match,alert -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment: *app_environment

volumes:
  postgres_data:
